<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#102b45" />
    <link
      rel="icon"
      href="assets/favicon.ico"
      sizes="16x16 32x32 48x48 64x64"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="512x512"
      href="assets/hub-mark.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="assets/apple-touch-icon.png"
    />
    <title>DELTA Thermal Tool Hub</title>
    <script>
      let mode = "auto";
      try {
        mode = localStorage.getItem("backgroundMode") || "auto";
      } catch {}
      function scene() {
        let h = new Date().getHours();
        document.documentElement.dataset.scene = [
          "day",
          "dusk",
          "night",
        ].includes(mode)
          ? mode
          : h < 6 || h >= 19
            ? "night"
            : h >= 17
              ? "dusk"
              : "day";
      }
      scene();
      let backdrop = "city";
      try {
        backdrop =
          new URLSearchParams(location.search).get("backdrop") ||
          localStorage.getItem("backdrop") ||
          "city";
      } catch {}
      document.documentElement.dataset.backdrop = [
        "delta",
        "city",
        "harbor",
        "ridge",
        "none",
      ].includes(backdrop)
        ? backdrop
        : "city";
      // Backdrop defocus. 100% matches the original baked blur (26 px sigma on
      // the 1600 px source); the images are pre-blurred by 6 px, so CSS adds
      // the remainder, scaled to how large the image is drawn.
      let blurPct = 95;
      try {
        const saved = parseFloat(localStorage.getItem("backdropBlur"));
        if (saved >= 0 && saved <= 200) blurPct = saved;
      } catch {}
      function applyBlur(pct) {
        blurPct = pct;
        const scale = Math.max(innerWidth / 1600, innerHeight / 1000);
        const sigma = (26 * pct) / 100;
        const px = Math.sqrt(Math.max(0, sigma * sigma - 36)) * scale;
        document.documentElement.style.setProperty(
          "--blur-px",
          px.toFixed(1) + "px",
        );
      }
      applyBlur(blurPct);
      addEventListener("resize", () => applyBlur(blurPct));
    </script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="sky dusk"></div>
    <div class="sky night"></div>
    <div class="backdrop" aria-hidden="true">
      <div class="bd-photo">
        <i class="day"></i><i class="dusk"></i><i class="night"></i>
      </div>
      <div class="bd-lights">
        <i class="day"></i><i class="dusk"></i><i class="night"></i>
      </div>
    </div>
    <header>
      <div class="brand">
        <span class="brandlogo"><img src="assets/delta.png" alt="DELTA" /></span
        ><span>Thermal Tool Hub</span>
      </div>
      <div class="header-tools">
      <button
        class="settings-btn"
        id="settings-btn"
        type="button"
        aria-label="背景設定"
        title="背景設定"
        aria-expanded="false"
        aria-controls="settings"
      >
        <svg aria-hidden="true" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="3" />
          <path
            d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"
          />
        </svg>
      </button>
      <div class="settings-panel" id="settings" lang="zh-Hant" hidden>
        <div>
          <h2 id="bd-title">背景場景</h2>
          <div class="backdrop-picker" role="radiogroup" aria-labelledby="bd-title">
        <label title="Delta campus"
          ><input type="radio" name="backdrop" value="delta" /><span
            >台達</span
          ></label
        >        <label title="City riverside"
          ><input type="radio" name="backdrop" value="city" /><span
            >城市</span
          ></label
        ><label title="Harbour pier"
          ><input type="radio" name="backdrop" value="harbor" /><span
            >海港</span
          ></label
        ><label title="Ridge with 5G towers"
          ><input type="radio" name="backdrop" value="ridge" /><span
            >山稜</span
          ></label
        ><label title="Plain gradient"
          ><input type="radio" name="backdrop" value="none" /><span
            >無</span
          ></label
        >
      </div>
        </div>
        <div>
          <div class="blur-row">
            <h2><label for="blur">霧化程度</label></h2>
            <output id="blur-value" for="blur">95%</output>
          </div>
          <div class="blur-control" id="blur-control">
            <span>清晰</span
            ><input id="blur" type="range" min="0" max="200" step="1" value="95" /><span
              >霧化</span
            >
          </div>
        </div>
        <button type="button" class="blur-reset" id="blur-reset">
          恢復預設
        </button>
      </div>
      <div
        class="scene-picker"
        id="theme"
        role="radiogroup"
        aria-label="Background mode"
      >
        <div class="scene-track">
          <div class="scene-drop" aria-hidden="true"><i></i></div>
          <label title="Auto"
            ><input
              type="radio"
              name="backgroundMode"
              value="auto"
              aria-label="Auto"
            /><svg aria-hidden="true" viewBox="0 0 24 24">
              <rect x="3" y="4" width="18" height="13" rx="2" />
              <path d="M8 21h8m-4-4v4" /></svg
            ><span>Auto</span></label
          ><label title="Day"
            ><input
              type="radio"
              name="backgroundMode"
              value="day"
              aria-label="Day"
            /><svg aria-hidden="true" viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="4" />
              <path
                d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"
              /></svg
            ><span>Day</span></label
          ><label title="Dusk"
            ><input
              type="radio"
              name="backgroundMode"
              value="dusk"
              aria-label="Dusk"
            /><svg aria-hidden="true" viewBox="0 0 24 24">
              <path
                d="M2 17h20M4 21h16M6 17a6 6 0 0 1 12 0M12 3v5m-3-3 3 3 3-3M3 10l2 2m16-2-2 2"
              /></svg
            ><span>Dusk</span></label
          ><label title="Night"
            ><input
              type="radio"
              name="backgroundMode"
              value="night"
              aria-label="Night"
            /><svg aria-hidden="true" viewBox="0 0 24 24">
              <path
                d="M20 15.3A8.6 8.6 0 0 1 8.7 4 8.7 8.7 0 1 0 20 15.3Z"
              /></svg
            ><span>Night</span></label
          >
        </div>
      </div>
      </div>
    </header>
    <main>
      <div class="layout">
        <section class="wheelPanel" aria-label="Tool wheel">
          <div class="stage" id="stage">
            <div class="wheel" id="wheel">
              <img class="stand" src="assets/stand.svg" alt="" />
              <img class="rotor" id="rotor" src="assets/rotor.svg" alt="" />
              <div class="axle">
                <div class="axle-face">
                  <img
                    class="delta-mark"
                    src="assets/hub-mark.png"
                    alt="Delta"
                  />
                </div>
              </div>
              <div id="cars"></div>
            </div>
          </div>
          <div class="wheelFoot">
            <span class="guide">Hover to pause · Drag or use ← →</span
            ><span id="groups"></span>
          </div>
        </section>
        <section class="detail" aria-label="Selected tool">
          <div class="tool-nav">
            <span id="fig"></span>
            <div class="nav">
              <button id="prev" aria-label="Previous tool">‹</button
              ><button id="next" aria-label="Next tool">›</button>
            </div>
          </div>
          <div id="preview" aria-live="polite">
            <figure>
              <img id="hero" alt="" />
            </figure>
            <div class="info">
              <div class="category" id="category"></div>
              <h1 lang="zh-Hant" id="name"></h1>
              <div id="en"></div>
              <p lang="zh-Hant" id="summary"></p>
            </div>
          </div>
          <div class="actions">
            <a id="launch" target="_blank" rel="noopener noreferrer"
              >Open tool ↗</a
            ><a id="share" target="_blank" rel="noopener noreferrer" hidden
              >Publish to team</a
            >
          </div>
        </section>
      </div>
    </main>
    <dialog id="dialog" lang="zh-Hant" aria-labelledby="add-title">
      <form id="form">
        <h2 id="add-title">新增工具</h2>
        <p>
          工具會儲存在這個瀏覽器。具有儲存庫寫入權限的成員也可以將工具發佈給團隊。
        </p>
        <label>工具名稱<input required name="name" maxlength="100" /></label
        ><label>車廂英文短名（選填）<input name="short" maxlength="16" /></label
        ><label
          >工具簡介<textarea
            required
            name="summary"
            maxlength="360"
          ></textarea></label
        ><label
          >工具入口網址<input
            required
            name="launchUrl"
            type="url"
            placeholder="https://" /></label
        ><label>原始碼網址（選填）<input name="repoUrl" type="url" /></label
        ><label
          >代表圖片（選填）<span class="file-picker"
            ><span>選擇圖片</span><span id="file-name">尚未選擇圖片</span
            ><input
              name="image"
              type="file"
              aria-label="選擇代表圖片"
              accept="image/png,image/jpeg,image/webp" /></span
        ></label>
        <p id="error" role="alert"></p>
        <footer>
          <button type="button" id="cancel">取消</button
          ><button class="primary">儲存工具</button>
        </footer>
      </form>
    </dialog>
    <script src="catalog.js"></script>
    <script src="app.js"></script>
  </body>
</html>
