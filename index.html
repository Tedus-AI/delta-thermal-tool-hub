<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#102b45" />
    <title>DELTA Thermal Tool Hub</title>
    <script>
      let mode = "auto";
      try {
        mode = localStorage.getItem("backgroundMode") || "auto";
      } catch {}
      function scene() {
        let h = new Date().getHours();
        document.documentElement.dataset.scene = [
          "day",
          "dusk",
          "night",
        ].includes(mode)
          ? mode
          : h < 6 || h >= 19
            ? "night"
            : h >= 17
              ? "dusk"
              : "day";
      }
      scene();
    </script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="sky dusk"></div>
    <div class="sky night"></div>
    <header>
      <div class="brand">
        <span class="brandlogo"><img src="assets/delta.png" alt="DELTA" /></span
        ><span>Thermal Tool Hub</span>
      </div>
      <label class="theme"
        >◐ <span>Scene</span>
        <select id="theme" aria-label="Background mode">
          <option value="auto">Auto</option>
          <option value="day">Day</option>
          <option value="dusk">Dusk</option>
          <option value="night">Night</option>
        </select></label
      >
    </header>
    <main>
      <div class="layout">
        <section class="wheelPanel" aria-label="Tool wheel">
          <div class="stage" id="stage">
            <div class="wheel" id="wheel">
              <img class="stand" src="assets/stand.svg" alt="" />
              <img class="rotor" id="rotor" src="assets/rotor.svg" alt="" />
              <div class="axle">
                <span class="delta-mark" role="img" aria-label="Delta"></span>
              </div>
              <div id="cars"></div>
            </div>
          </div>
          <div class="wheelFoot">
            <span class="guide">Drag or use ← →</span><span id="groups"></span>
          </div>
        </section>
        <section class="detail" aria-label="Selected tool">
          <div class="tool-nav">
            <span id="fig"></span>
            <div class="nav">
              <button id="prev" aria-label="Previous tool">‹</button
              ><button id="next" aria-label="Next tool">›</button>
            </div>
          </div>
          <div id="preview" aria-live="polite">
            <figure>
              <img id="hero" alt="" />
            </figure>
            <div class="info">
              <div class="category" id="category"></div>
              <h1 lang="zh-Hant" id="name"></h1>
              <div id="en"></div>
              <p lang="zh-Hant" id="summary"></p>
            </div>
          </div>
          <div class="actions">
            <a id="launch" target="_blank" rel="noopener noreferrer"
              >Open tool ↗</a
            ><a id="repo" target="_blank" rel="noopener noreferrer"
              >View source</a
            ><a id="share" target="_blank" rel="noopener noreferrer" hidden
              >Publish to team</a
            >
          </div>
        </section>
      </div>
    </main>
    <dialog id="dialog">
      <form id="form">
        <h2>Add tool</h2>
        <p>
          儲存後即可在此瀏覽器使用。有 repo 寫入權限的成員亦可透過 GitHub
          將工具Publish to team。
        </p>
        <label>Tool name<input required name="name" maxlength="100" /></label
        ><label
          >English cabin label (optional)<input
            name="short"
            maxlength="16" /></label
        ><label
          >Description<textarea
            required
            name="summary"
            maxlength="360"
          ></textarea></label
        ><label
          >Tool URL<input
            required
            name="launchUrl"
            type="url"
            placeholder="https://" /></label
        ><label
          >Repository URL (optional)<input name="repoUrl" type="url" /></label
        ><label
          >Tool image (optional)<input
            name="image"
            type="file"
            accept="image/png,image/jpeg,image/webp"
        /></label>
        <p id="error" role="alert"></p>
        <footer>
          <button type="button" id="cancel">Cancel</button
          ><button class="primary">Save tool</button>
        </footer>
      </form>
    </dialog>
    <script src="catalog.js"></script>
    <script src="app.js"></script>
  </body>
</html>
