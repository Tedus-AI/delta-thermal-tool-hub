<!doctype html>
<html lang="en">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Delta · Rotating hub preview</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      min-height: 100svh;
      background: radial-gradient(ellipse at 50% 40%, #284b60, #0b1c2c 70%);
      color: #eaf8ff;
      display: grid;
      place-items: center;
      font:
        16px/1.5 Arial,
        sans-serif;
    }
    main {
      text-align: center;
      width: min(90vw, 560px);
      padding: 2rem 0;
    }
    h1 {
      font-size: clamp(22px, 4vw, 32px);
      margin: 0 0 1.8rem;
    }
    .disc {
      width: min(72vw, 52vh, 420px);
      aspect-ratio: 1;
      border-radius: 50%;
      margin: auto;
      background: radial-gradient(at 38% 28%, white 34%, #e4f2f6);
      border: 4px double #7299a4;
      box-shadow:
        0 0 0 4px #457383,
        0 0 0 6px #b2e9e8,
        -10px 3px 32px #64d7d766,
        8px 6px 34px #0087dc66,
        0 -6px 22px #b9eb5f44;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
      border-radius: 50%;
      touch-action: pan-y;
      cursor: grab;
    }
    canvas:active {
      cursor: grabbing;
    }
    button {
      margin: 1.8rem 0.25rem 0;
      padding: 0.55rem 1rem;
      background: #294a5d;
      color: white;
      border: 1px solid #7095a7;
      border-radius: 8px;
      font: inherit;
      cursor: pointer;
    }
    p {
      color: #bcd3df;
      margin: 0.65rem;
    }
  </style>
  <main>
    <h1>Rotating hub preview</h1>
    <div class="disc">
      <canvas
        width="800"
        height="800"
        aria-label="Extruded Delta triangle rotating about its vertical centerline"
      ></canvas>
    </div>
    <button id="toggle"></button><button id="front">Front view</button>
    <p>Drag to rotate</p>
  </main>
  <script>
    const canvas = document.querySelector("canvas"),
      ctx = canvas.getContext("2d"),
      art = new Image();
    art.src = "../hub-mark.png";
    let angle = 0,
      playing = !matchMedia("(prefers-reduced-motion:reduce)").matches,
      previous = null,
      drag = null;
    const corners = [
      [0, -1],
      [-Math.sqrt(3) / 2, 0.5],
      [Math.sqrt(3) / 2, 0.5],
    ];
    const halfDepth = 0.085;
    function project(x, y, z) {
      return [
        400 + 390 * (x * Math.cos(angle) + z * Math.sin(angle)),
        400 + 390 * y,
      ];
    }
    function polygon(points) {
      ctx.beginPath();
      points.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)));
      ctx.closePath();
    }
    function draw() {
      ctx.clearRect(0, 0, 800, 800);
      const cosine = Math.cos(angle),
        sine = Math.sin(angle);
      for (let i = 0; i < 3; i++) {
        const [x, y] = corners[i],
          [u, v] = corners[(i + 1) % 3];
        if ((v - y) * sine <= 0) continue;
        polygon([
          project(x, y, -halfDepth),
          project(u, v, -halfDepth),
          project(u, v, halfDepth),
          project(x, y, halfDepth),
        ]);
        const g = ctx.createLinearGradient(0, 0, 0, 800);
        g.addColorStop(0, "#71c9ee");
        g.addColorStop(0.44, "#0879ab");
        g.addColorStop(1, "#034269");
        ctx.fillStyle = g;
        ctx.fill();
      }
      const side = cosine >= 0 ? 1 : -1,
        z = side * halfDepth;
      ctx.save();
      polygon(corners.map(([x, y]) => project(x, y, z)));
      ctx.clip();
      ctx.fillStyle = "#0087dc";
      ctx.fillRect(0, 0, 800, 800);
      if (art.complete && art.naturalWidth) {
        ctx.translate(400 + 390 * z * sine, 400);
        ctx.scale(Math.abs(cosine) * 390, 390);
        ctx.drawImage(art, -1, -1, 2, 2);
      }
      ctx.restore();
    }
    function sync() {
      document.querySelector("#toggle").textContent = playing
        ? "Pause"
        : "Play";
    }
    function frame(t) {
      if (playing && drag === null && previous !== null)
        angle += (Math.min(t - previous, 80) * 2 * Math.PI) / 8000;
      previous = t;
      draw();
      requestAnimationFrame(frame);
    }
    document.querySelector("#toggle").onclick = () => {
      playing = !playing;
      sync();
    };
    document.querySelector("#front").onclick = () => {
      playing = false;
      angle = 0;
      sync();
    };
    canvas.onpointerdown = (e) => {
      canvas.setPointerCapture(e.pointerId);
      drag = e.clientX;
    };
    canvas.onpointermove = (e) => {
      if (drag !== null) {
        angle += ((e.clientX - drag) * 2 * Math.PI) / canvas.clientWidth;
        drag = e.clientX;
      }
    };
    canvas.onlostpointercapture = () => (drag = null);
    sync();
    requestAnimationFrame(frame);
  </script>
</html>
