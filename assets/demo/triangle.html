  </main>
  <script>
    const scene = document.querySelector("svg");
    const ns = scene.namespaceURI;
    const height = Math.sqrt(2);
    const vertices = [[0, (3 * height) / 4, 0]];
    for (let i = 0; i < 3; i++) {
      const theta = ((i * 2 - 1) * Math.PI) / 3;
      vertices.push([Math.sin(theta), -height / 4, Math.cos(theta)]);
    }
    const faces = [
      [0, 1, 2],
      [0, 2, 3],
      [0, 3, 1],
      [1, 3, 2],
    ].map((indices) => {
      const el = document.createElementNS(ns, "use");
      el.setAttribute("href", "#face");
      scene.append(el);
      return { indices, el };
    });
    let yaw = 0.38,
      pitch = 0.19,
      drag = null,
      previous = null;
    let playing = !matchMedia("(prefers-reduced-motion:reduce)").matches;
    function draw() {
      const points = vertices.map(([x, y, z]) => {
        const depth = z * Math.cos(yaw) - x * Math.sin(yaw);
        return [
          x * Math.cos(yaw) + z * Math.sin(yaw),
          depth * Math.sin(pitch) - y * Math.cos(pitch),
          y * Math.sin(pitch) + depth * Math.cos(pitch),
        ];
      });
      for (const { indices, el } of faces) {
        const [tip, left, right] = indices.map((i) => points[i]);
        const u = left.map((n, i) => n - tip[i]),
          v = right.map((n, i) => n - tip[i]);
        const nz = u[1] * v[0] - u[0] * v[1];
        el.style.display = nz > 1e-8 ? "" : "none";
        if (nz <= 1e-8) continue;
        const nx = u[2] * v[1] - u[1] * v[2],
          ny = u[0] * v[2] - u[2] * v[0];
        const diffuse = Math.max(
          0,
          (-0.42 * nx - 0.6 * ny + 0.68 * nz) / Math.hypot(nx, ny, nz),
        );
        el.style.color = "hsl(202 97% " + (25 + 22 * diffuse) + "%)";
        const a = (right[0] - left[0]) / 60,
          b = (right[1] - left[1]) / 60;
        const c = (u[0] + v[0]) / 98,
          d = (u[1] + v[1]) / 98;
        el.setAttribute(
          "transform",
          "matrix(" +
            [a, b, c, d, tip[0] - 30 * a, tip[1] - 30 * b].join(" ") +
            ")",
        );
      }
    }
    function sync() {
      document.querySelector("#toggle").textContent = playing
        ? "Pause"
        : "Play";
    }
    function frame(now) {
      if (playing && drag === null && previous !== null) {
        yaw += (Math.min(now - previous, 80) * 2 * Math.PI) / 10000;
        draw();
      }
      previous = now;
      requestAnimationFrame(frame);
    }
    document.querySelector("#toggle").onclick = () => {
      playing = !playing;
      sync();
    };
    document.querySelector("#front").onclick = () => {
      playing = false;
      yaw = 0;
      pitch = 0.19;
      draw();
      sync();
    };
    scene.onpointerdown = (e) => {
      scene.setPointerCapture(e.pointerId);
      drag = [e.clientX, e.clientY];
    };
    scene.onpointermove = (e) => {
      if (drag === null) return;
      yaw += ((e.clientX - drag[0]) * 2 * Math.PI) / scene.clientWidth;
      pitch = Math.max(
        -1.48,
        Math.min(
          1.48,
          pitch + ((e.clientY - drag[1]) * Math.PI) / scene.clientHeight,
        ),
      );
      drag = [e.clientX, e.clientY];
      draw();
    };
    scene.onlostpointercapture = () => (drag = null);
    draw();
    sync();
    requestAnimationFrame(frame);
  </script>
