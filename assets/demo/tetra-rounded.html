<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Delta Rounded Tetrahedron</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100svh;
        background: radial-gradient(ellipse at 50% 40%, #284b60, #0b1c2c 70%);
        color: #eaf8ff;
        display: grid;
        place-items: center;
        font:
          15px/1.5 Inter,
          "Noto Sans TC",
          Arial,
          sans-serif;
      }
      main {
        width: min(100% - 32px, 760px);
        padding: 28px 0;
        text-align: center;
      }
      h1 {
        font-size: clamp(20px, 3.4vw, 28px);
        margin: 0 0 4px;
      }
      .sub {
        color: #bcd3df;
        margin: 0 0 22px;
      }
      .row {
        display: flex;
        gap: 28px;
        justify-content: center;
        align-items: center;
        flex-wrap: wrap;
      }
      figure {
        margin: 0;
      }
      figcaption {
        margin-top: 10px;
        font-size: 13px;
        color: #9fbccb;
      }
      /* Same face as the wheel's centre axle in style.css (.axle). */
      .axle {
        position: relative;
        aspect-ratio: 1;
        border-radius: 50%;
        background: radial-gradient(at 36% 25%, white 25%, #e4f3fa 75%, #adccd7);
        border: 3px double #6f9cae;
        box-shadow:
          0 0 0 4px #6494a5,
          0 0 0 6px #c8f4f5,
          0 0 22px #64d7d78c;
        overflow: hidden;
      }
      .axle.big {
        width: min(78vw, 56svh, 440px);
      }
      .axle.small {
        width: 116px;
      }
      .axle canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
        cursor: grab;
      }
      .axle canvas:active {
        cursor: grabbing;
      }
      .controls {
        margin: 26px auto 0;
        display: grid;
        gap: 12px;
        max-width: 460px;
      }
      .controls label {
        display: grid;
        grid-template-columns: 7.5em 1fr 4em;
        align-items: center;
        gap: 10px;
        text-align: left;
        font-size: 14px;
      }
      .controls output {
        font: 600 13px/1 monospace;
        text-align: right;
      }
      input[type="range"] {
        width: 100%;
        accent-color: #64d7d7;
      }
      .buttons {
        display: flex;
        gap: 8px;
        justify-content: center;
      }
      button {
        padding: 0.5rem 1rem;
        background: #294a5d;
        color: white;
        border: 1px solid #7095a7;
        border-radius: 8px;
        font: inherit;
        cursor: pointer;
      }
      button:focus-visible,
      input:focus-visible {
        outline: 2px solid #b9eb5f;
        outline-offset: 2px;
      }
      .note {
        color: #9fbccb;
        font-size: 13px;
        margin-top: 14px;
      }
    </style>
  </head>
  <body>
    <main lang="zh-Hant">
      <h1>台達立體三角形 · 圓角四面體</h1>
      <p class="sub">正四面體，以上方頂點的垂直軸旋轉；邊與角以 R 圓角修整</p>
      <div class="row">
        <figure>
          <div class="axle big"><canvas id="big"></canvas></div>
          <figcaption>放大預覽（可拖曳旋轉）</figcaption>
        </figure>
        <figure>
          <div class="axle small"><canvas id="small"></canvas></div>
          <figcaption>摩天輪中心實際大小</figcaption>
        </figure>
      </div>
      <div class="controls">
        <label
          >圓角 R（邊長=1）<input
            id="radius"
            type="range"
            min="0"
            max="0.1"
            step="0.005"
            value="0.03" /><output id="radius-out">0.030</output></label
        >
        <label
          >旋轉一圈（秒）<input
            id="period"
            type="range"
            min="3"
            max="30"
            step="1"
            value="10" /><output id="period-out">10 s</output></label
        >
        <div class="buttons">
          <button id="toggle" type="button">暫停</button
          ><button id="front" type="button">正面</button>
        </div>
      </div>
      <p class="note">
        R 以四面體邊長為 1 計算（R0.1 會圓得很明顯，可拉到最右邊比較）；四個面仍保持平面並帶有台達標誌，圓角只在邊與頂點。
      </p>
    </main>

    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
      }
    </script>
    <script type="module">
      import * as THREE from "three";
      import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

      // ---- Logo face texture: blue triangle with the white Delta mark --------
      // Mark path in the same frame as the existing demo: triangle (30,0) (0,49) (60,49).
      const MARK =
        "M 643 401.042 C 626.705 402.291, 618.154 404.429, 605 410.542 C 597.228 414.153, 590.744 416.397, 585 417.463 C 568.079 420.601, 565.429 421.226, 561.121 423.098 C 558.713 424.145, 553.626 427.312, 549.816 430.136 C 544.480 434.092, 540.508 436.027, 532.512 438.564 C 519.970 442.545, 519.360 442.851, 510.366 449.682 C 506.012 452.988, 499.849 456.428, 494.554 458.507 C 483.946 462.671, 480.700 464.652, 475.327 470.241 C 473.032 472.628, 467.146 476.954, 462.248 479.853 C 457.350 482.753, 450.524 487.583, 447.079 490.587 C 443.634 493.591, 437.500 497.869, 433.447 500.093 C 428.410 502.858, 424.433 506.037, 420.877 510.141 C 418.017 513.444, 413.059 517.923, 409.860 520.095 C 406.212 522.572, 402.537 526.264, 400 530 C 397.429 533.786, 393.786 537.429, 390 540 C 386.214 542.571, 382.571 546.214, 380 550 C 377.429 553.786, 373.786 557.429, 370 560 C 366.221 562.566, 362.571 566.214, 360.013 569.980 C 357.796 573.245, 354.074 577.237, 351.741 578.852 C 345.607 583.098, 343.493 585.697, 340.206 593.033 C 338.536 596.760, 334.640 602.560, 331.138 606.533 C 327.542 610.614, 322.883 617.591, 319.891 623.376 C 316.597 629.744, 313.084 634.895, 310 637.876 C 304.568 643.128, 302.254 647.321, 298.933 657.931 C 297.654 662.018, 295.233 667.318, 293.554 669.710 C 291.874 672.101, 288.793 676.439, 286.707 679.350 C 283.478 683.856, 282.324 687.051, 278.952 700.825 C 276.773 709.725, 273.230 721.635, 271.079 727.291 C 260.595 754.861, 260.338 794.820, 270.514 815.027 C 272.464 818.900, 275.676 827.115, 277.651 833.284 C 282.715 849.100, 285.174 853.886, 290.537 858.369 C 293.083 860.497, 297.129 865.301, 299.529 869.045 C 302.670 873.946, 305.576 876.996, 309.904 879.935 C 313.211 882.180, 317.237 885.926, 318.852 888.259 C 323.611 895.135, 326.241 896.957, 337.151 900.940 C 342.843 903.018, 352 907.010, 357.500 909.812 C 374.623 918.536, 384.360 919.980, 426.144 919.992 C 469.308 920.004, 478.627 918.658, 502.780 908.924 C 509.533 906.202, 520.035 902.622, 526.116 900.969 C 538.210 897.680, 541.191 896.393, 548.131 891.464 C 554.756 886.758, 558.163 885.147, 569.364 881.427 C 578.795 878.294, 583.565 875.570, 593.693 867.533 C 595.999 865.703, 601.907 862.767, 606.824 861.009 C 613.154 858.744, 617.555 856.360, 621.908 852.838 C 630.444 845.932, 632.860 845.710, 643.457 850.865 C 677.689 867.515, 746.944 867.092, 769.875 850.093 C 773.603 847.329, 780.474 843.311, 785.144 841.164 C 791.712 838.143, 794.525 836.180, 797.567 832.492 C 803.632 825.140, 807.099 821.783, 812.239 818.284 C 815.292 816.205, 817.942 813.249, 819.732 809.927 C 821.254 807.100, 824.525 802.080, 827 798.771 C 837.970 784.108, 839.519 780.322, 843.065 759.500 C 849.821 719.833, 843.600 673.177, 829.551 658.158 C 816.026 643.699, 815.608 623.344, 828.019 583.563 C 836.463 556.496, 836.286 531.433, 827.495 509.500 C 825.511 504.550, 822.572 494.473, 820.964 487.108 C 817.450 471.010, 815.486 466.666, 809.440 461.611 C 806.907 459.494, 802.871 454.699, 800.471 450.955 C 797.330 446.054, 794.424 443.004, 790.096 440.065 C 786.789 437.820, 782.729 434.013, 781.073 431.606 C 776.452 424.889, 772.886 422.460, 762.635 419.045 C 757.446 417.316, 750.342 414.107, 746.850 411.914 C 730.842 401.861, 726.112 400.982, 685.500 400.516 C 668.450 400.321, 649.325 400.557, 643 401.042 M 658.500 453.052 C 654.650 453.482, 647.675 454.757, 643 455.886 C 638.325 457.015, 628.425 458.643, 621 459.503 C 603.669 461.512, 601.784 462.056, 588.003 469.036 C 581.676 472.241, 571.775 476.306, 566 478.071 C 551.977 482.357, 545.913 485.124, 540.239 489.830 C 537.632 491.991, 530.550 496.282, 524.500 499.365 C 518.450 502.449, 510.837 507.261, 507.582 510.060 C 504.327 512.859, 497.761 517.109, 492.992 519.504 C 486.178 522.926, 483.199 525.153, 479.090 529.897 C 476.160 533.278, 471.362 537.354, 468.180 539.163 C 465.056 540.939, 460.025 544.704, 457 547.529 C 453.975 550.353, 447.900 555.401, 443.500 558.746 C 433.953 566.004, 404.271 595.827, 397.466 605 C 394.814 608.575, 390.517 613.790, 387.918 616.589 C 385.318 619.388, 381.829 624.377, 380.164 627.676 C 378.073 631.817, 375.001 635.566, 370.239 639.789 C 364.584 644.802, 362.827 647.128, 360.485 652.702 C 357.292 660.305, 354.758 664.614, 350.019 670.500 C 345.256 676.415, 342.426 682.558, 338.889 694.660 C 335.313 706.890, 333.667 710.532, 328.151 718.406 C 313.270 739.649, 314.085 806.193, 329.431 822.907 C 331.750 825.433, 335.534 830.229, 337.839 833.565 C 347.071 846.924, 359.935 855.331, 380.798 861.639 C 411.120 870.808, 420.421 871.809, 440.199 868.034 C 445.865 866.952, 455.256 865.371, 461.069 864.520 C 487.056 860.713, 498.763 857.638, 511.500 851.273 C 518.100 847.974, 528.169 843.833, 533.875 842.070 C 547.772 837.776, 554.276 834.790, 559.846 830.144 C 562.406 828.010, 566.975 825.019, 570 823.497 C 587.366 814.763, 588.857 811.772, 584.468 794.477 C 583.076 788.990, 581.056 779.615, 579.981 773.645 C 578.905 767.675, 576.693 758.336, 575.064 752.891 C 568.425 730.700, 568.584 725.311, 576.942 689.393 C 582.644 664.889, 583.249 663.234, 589.155 655.959 C 591.592 652.956, 595.110 648.250, 596.972 645.500 C 601.557 638.730, 614.225 625.727, 627.290 614.380 C 639.563 603.723, 640.706 603.029, 651 600.005 C 655.125 598.793, 665.367 595.583, 673.761 592.871 C 699.884 584.433, 719.409 583.964, 738.500 591.316 C 770.125 603.497, 777.697 598.856, 780.170 565.776 C 782.606 533.205, 779.222 511.251, 770.032 500 C 768.010 497.525, 764.733 492.575, 762.750 489 C 759.143 482.498, 755.015 478.030, 745.350 470.170 C 730.396 458.007, 688.357 449.722, 658.500 453.052";
      const BLUE = "#0a84d8";
      const TEX_W = 1200,
        TEX_H = 980; // logo frame 60 x 49, at 20x
      const canvas = document.createElement("canvas");
      canvas.width = TEX_W;
      canvas.height = TEX_H;
      const g = canvas.getContext("2d");
      g.fillStyle = BLUE;
      g.fillRect(0, 0, TEX_W, TEX_H);
      g.save();
      g.scale(20 * 0.05, 20 * 0.05);
      g.fillStyle = "#ffffff";
      g.fill(new Path2D(MARK), "evenodd");
      g.restore();
      const faceTexture = new THREE.CanvasTexture(canvas);
      faceTexture.colorSpace = THREE.SRGBColorSpace;
      faceTexture.anisotropy = 8;

      // ---- Rounded regular tetrahedron ---------------------------------------
      // Edge length 1, apex up, centroid at the origin. Rounding keeps the four
      // face planes where they are (a true fillet of radius r): the faces are
      // the inner tetrahedron's faces pushed out by r, the edges are cylinders
      // and the corners spherical triangles, all with exact normals.
      const L = 1;
      const H = Math.sqrt(2 / 3) * L; // height
      const R0 = L / Math.sqrt(3); // circumradius of base triangle
      const outer = [new THREE.Vector3(0, (3 * H) / 4, 0)];
      for (let i = 0; i < 3; i++) {
        const t = ((i * 2 - 1) * Math.PI) / 3;
        outer.push(new THREE.Vector3(R0 * Math.sin(t), -H / 4, R0 * Math.cos(t)));
      }
      const FACES = [
        [0, 1, 2],
        [0, 2, 3],
        [0, 3, 1],
        [1, 3, 2],
      ]; // first index is the face's "up" corner for the logo
      const INRADIUS = L / (2 * Math.sqrt(6));

      function faceNormal(a, b, c) {
        const n = new THREE.Vector3()
          .subVectors(b, a)
          .cross(new THREE.Vector3().subVectors(c, a))
          .normalize();
        // make outward
        if (n.dot(a) < 0) n.negate();
        return n;
      }

      function buildGeometry(r) {
        r = Math.min(r, INRADIUS * 0.98);
        const s = (INRADIUS - r) / INRADIUS;
        const inner = outer.map((v) => v.clone().multiplyScalar(s));
        const normals = FACES.map(([a, b, c]) => faceNormal(outer[a], outer[b], outer[c]));

        const flat = { pos: [], nor: [], uv: [] };
        const round = { pos: [], nor: [] };
        const LOGO = [
          [30, 0],
          [0, 49],
          [60, 49],
        ];

        // Flat faces, UV mapped from the *outer* face so the mark keeps its size.
        FACES.forEach(([a, b, c], f) => {
          const n = normals[f];
          const tri = [a, b, c].map((i) => inner[i].clone().addScaledVector(n, r));
          const [A, B, C] = [a, b, c].map((i) => outer[i]);
          const v0 = new THREE.Vector3().subVectors(B, A),
            v1 = new THREE.Vector3().subVectors(C, A);
          const d00 = v0.dot(v0),
            d01 = v0.dot(v1),
            d11 = v1.dot(v1),
            den = d00 * d11 - d01 * d01;
          for (const p of tri) {
            const v2 = new THREE.Vector3().subVectors(p, A);
            const d20 = v2.dot(v0),
              d21 = v2.dot(v1);
            const wb = (d11 * d20 - d01 * d21) / den,
              wc = (d00 * d21 - d01 * d20) / den,
              wa = 1 - wb - wc;
            const x = wa * LOGO[0][0] + wb * LOGO[1][0] + wc * LOGO[2][0];
            const y = wa * LOGO[0][1] + wb * LOGO[1][1] + wc * LOGO[2][1];
            flat.pos.push(p.x, p.y, p.z);
            flat.nor.push(n.x, n.y, n.z);
            flat.uv.push(x / 60, 1 - y / 49);
          }
        });

        if (r > 0) {
          const push = (center, nrm) => {
            round.pos.push(center.x + nrm.x * r, center.y + nrm.y * r, center.z + nrm.z * r);
            round.nor.push(nrm.x, nrm.y, nrm.z);
          };
          const slerp = (n1, n2, t) => {
            const ang = n1.angleTo(n2);
            const so = Math.sin(ang);
            return n1
              .clone()
              .multiplyScalar(Math.sin((1 - t) * ang) / so)
              .addScaledVector(n2, Math.sin(t * ang) / so);
          };
          // Edges: each pair of faces shares one edge.
          const SEG = 16;
          for (let f1 = 0; f1 < 4; f1++)
            for (let f2 = f1 + 1; f2 < 4; f2++) {
              const shared = FACES[f1].filter((i) => FACES[f2].includes(i));
              const [p, q] = shared.map((i) => inner[i]);
              const n1 = normals[f1],
                n2 = normals[f2];
              for (let k = 0; k < SEG; k++) {
                const a = slerp(n1, n2, k / SEG),
                  b = slerp(n1, n2, (k + 1) / SEG);
                push(p, a), push(q, a), push(q, b);
                push(p, a), push(q, b), push(p, b);
              }
            }
          // Corners: spherical triangle spanned by the three face normals.
          const DIV = 12;
          for (let v = 0; v < 4; v++) {
            const ns = FACES.map((f, i) => (f.includes(v) ? normals[i] : null)).filter(Boolean);
            const P = (i, j) => {
              // barycentric grid point, normalized onto the sphere
              const k = DIV - i - j;
              return new THREE.Vector3()
                .addScaledVector(ns[0], k)
                .addScaledVector(ns[1], i)
                .addScaledVector(ns[2], j)
                .normalize();
            };
            for (let i = 0; i < DIV; i++)
              for (let j = 0; j < DIV - i; j++) {
                push(inner[v], P(i, j)), push(inner[v], P(i + 1, j)), push(inner[v], P(i, j + 1));
                if (j < DIV - i - 1) {
                  push(inner[v], P(i + 1, j)), push(inner[v], P(i + 1, j + 1)), push(inner[v], P(i, j + 1));
                }
              }
          }
        }

        const make = (o, uv) => {
          const geo = new THREE.BufferGeometry();
          geo.setAttribute("position", new THREE.Float32BufferAttribute(o.pos, 3));
          geo.setAttribute("normal", new THREE.Float32BufferAttribute(o.nor, 3));
          if (uv) geo.setAttribute("uv", new THREE.Float32BufferAttribute(o.uv, 2));
          return geo;
        };
        return { flat: make(flat, true), round: make(round, false) };
      }

      // ---- Materials --------------------------------------------------------
      const common = { roughness: 0.38, metalness: 0, clearcoat: 0.2, clearcoatRoughness: 0.35, envMapIntensity: 0.3, side: THREE.DoubleSide };
      const faceMat = new THREE.MeshPhysicalMaterial({ ...common, map: faceTexture });
      const edgeMat = new THREE.MeshPhysicalMaterial({ ...common, color: new THREE.Color(BLUE) });

      // ---- Views (big preview + actual axle size) ----------------------------
      const state = {
        r: 0.03,
        period: 10,
        playing: !matchMedia("(prefers-reduced-motion: reduce)").matches,
        yaw: 0.38,
        pitch: 0.19,
      };
      const views = [];

      function makeView(el) {
        const renderer = new THREE.WebGLRenderer({ canvas: el, antialias: true, alpha: true });
        renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
        renderer.toneMapping = THREE.NoToneMapping;
        const scene = new THREE.Scene();
        const pmrem = new THREE.PMREMGenerator(renderer);
        scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
        const key = new THREE.DirectionalLight(0xffffff, 1.3);
        key.position.set(-2, 3, 4);
        scene.add(key);
        scene.add(new THREE.AmbientLight(0xffffff, 0.35));
        const fill = new THREE.DirectionalLight(0xcfefff, 0.5);
        fill.position.set(3, -1, 2);
        scene.add(fill);
        const camera = new THREE.PerspectiveCamera(24, 1, 0.1, 20);
        camera.position.set(0, 0, 3.05);
        const tilt = new THREE.Group(); // pitch (camera tilt)
        const spin = new THREE.Group(); // yaw around the apex axis
        tilt.add(spin);
        scene.add(tilt);
        // centre the shape in the disc (centroid sits 0 below the apex axis)
        tilt.position.y = -0.05;
        const v = { renderer, scene, camera, tilt, spin, el, meshes: [] };
        views.push(v);
        return v;
      }

      function rebuild() {
        const geo = buildGeometry(state.r);
        for (const v of views) {
          v.meshes.forEach((m) => v.spin.remove(m));
          v.meshes = [new THREE.Mesh(geo.flat, faceMat), new THREE.Mesh(geo.round, edgeMat)];
          v.meshes.forEach((m) => v.spin.add(m));
        }
      }

      function resize() {
        for (const v of views) {
          const w = v.el.clientWidth,
            h = v.el.clientHeight;
          v.renderer.setSize(w, h, false);
          v.camera.aspect = w / h;
          v.camera.updateProjectionMatrix();
        }
      }

      function render() {
        for (const v of views) {
          v.spin.rotation.y = state.yaw;
          v.tilt.rotation.x = state.pitch;
          v.renderer.render(v.scene, v.camera);
        }
      }

      makeView(document.getElementById("big"));
      makeView(document.getElementById("small"));
      rebuild();
      resize();
      addEventListener("resize", resize);

      let last = null;
      function frame(now) {
        if (state.playing && !drag && last !== null)
          state.yaw += (Math.min(now - last, 80) / 1000) * ((2 * Math.PI) / state.period);
        last = now;
        render();
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);

      // ---- Interaction --------------------------------------------------------
      let drag = null;
      for (const v of views) {
        v.el.addEventListener("pointerdown", (e) => {
          v.el.setPointerCapture(e.pointerId);
          drag = [e.clientX, e.clientY, v.el];
        });
        v.el.addEventListener("pointermove", (e) => {
          if (!drag || drag[2] !== v.el) return;
          state.yaw += ((e.clientX - drag[0]) * 2 * Math.PI) / v.el.clientWidth;
          state.pitch = Math.max(-1.2, Math.min(1.2, state.pitch + ((e.clientY - drag[1]) * Math.PI) / v.el.clientHeight));
          drag = [e.clientX, e.clientY, v.el];
        });
        v.el.addEventListener("lostpointercapture", () => (drag = null));
      }
      const $ = (id) => document.getElementById(id);
      $("radius").addEventListener("input", (e) => {
        state.r = +e.target.value;
        $("radius-out").textContent = state.r.toFixed(3);
        rebuild();
      });
      $("period").addEventListener("input", (e) => {
        state.period = +e.target.value;
        $("period-out").textContent = state.period + " s";
      });
      const sync = () => ($("toggle").textContent = state.playing ? "暫停" : "播放");
      $("toggle").onclick = () => {
        state.playing = !state.playing;
        sync();
      };
      $("front").onclick = () => {
        state.playing = false;
        state.yaw = 0;
        state.pitch = 0.19;
        sync();
      };
      sync();
      window.__demo = state;
    </script>
  </body>
</html>
