<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Delta Rounded Tetrahedron</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100svh;
        background: radial-gradient(ellipse at 50% 40%, #284b60, #0b1c2c 70%);
        color: #eaf8ff;
        display: grid;
        place-items: center;
        font:
          15px/1.5 Inter,
          "Noto Sans TC",
          Arial,
          sans-serif;
      }
      main {
        width: min(100% - 32px, 760px);
        padding: 28px 0;
        text-align: center;
      }
      h1 {
        font-size: clamp(20px, 3.4vw, 28px);
        margin: 0 0 4px;
      }
      .sub {
        color: #bcd3df;
        margin: 0 0 22px;
      }
      .row {
        display: flex;
        gap: 28px;
        justify-content: center;
        align-items: center;
        flex-wrap: wrap;
      }
      figure {
        margin: 0;
      }
      figcaption {
        margin-top: 10px;
        font-size: 13px;
        color: #9fbccb;
      }
      /* Same face as the wheel's centre axle in style.css (.axle). */
      .axle {
        position: relative;
        aspect-ratio: 1;
        border-radius: 50%;
        background: radial-gradient(at 36% 25%, white 25%, #e4f3fa 75%, #adccd7);
        border: 3px double #6f9cae;
        box-shadow:
          0 0 0 4px #6494a5,
          0 0 0 6px #c8f4f5,
          0 0 22px #64d7d78c;
        overflow: hidden;
      }
      .axle.big {
        width: min(78vw, 56svh, 440px);
      }
      .axle.small {
        width: 116px;
      }
      .axle canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
        cursor: grab;
      }
      .axle canvas:active {
        cursor: grabbing;
      }
      .controls {
        margin: 26px auto 0;
        display: grid;
        gap: 12px;
        max-width: 460px;
      }
      .controls label {
        display: grid;
        grid-template-columns: 7.5em 1fr 4em;
        align-items: center;
        gap: 10px;
        text-align: left;
        font-size: 14px;
      }
      .controls output {
        font: 600 13px/1 monospace;
        text-align: right;
      }
      input[type="range"] {
        width: 100%;
        accent-color: #64d7d7;
      }
      .buttons {
        display: flex;
        gap: 8px;
        justify-content: center;
      }
      button {
        padding: 0.5rem 1rem;
        background: #294a5d;
        color: white;
        border: 1px solid #7095a7;
        border-radius: 8px;
        font: inherit;
        cursor: pointer;
      }
      button:focus-visible,
      input:focus-visible {
        outline: 2px solid #b9eb5f;
        outline-offset: 2px;
      }
      .note {
        color: #9fbccb;
        font-size: 13px;
        margin-top: 14px;
      }
    </style>
  </head>
  <body>
    <main lang="zh-Hant">
      <h1>台達立體三角形 · 圓角四面體</h1>
      <p class="sub">正四面體，以上方頂點的垂直軸旋轉；邊與角以 R 圓角修整</p>
      <div class="row">
        <figure>
          <div class="axle big"><canvas id="big"></canvas></div>
          <figcaption>放大預覽（可拖曳旋轉）</figcaption>
        </figure>
        <figure>
          <div class="axle small"><canvas id="small"></canvas></div>
          <figcaption>摩天輪中心實際大小</figcaption>
        </figure>
      </div>
      <div class="controls">
        <label
          >圓角 R（邊長=1）<input
            id="radius"
            type="range"
            min="0"
            max="0.1"
            step="0.001"
            value="0.01" /><output id="radius-out">0.010</output></label
        >
        <label
          >旋轉一圈（秒）<input
            id="period"
            type="range"
            min="10"
            max="180"
            step="1"
            value="120" /><output id="period-out">120 s</output></label
        >
        <div class="buttons">
          <button id="toggle" type="button">暫停</button
          ><button id="front" type="button">正面</button>
        </div>
      </div>
      <p class="note">
        R 以四面體邊長為 1 計算（R0.1 會圓得很明顯，可拉到最右邊比較）；四個面仍保持平面並帶有台達標誌，圓角只在邊與頂點。
      </p>
    </main>

    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
      }
    </script>
    <script type="module">
      import * as THREE from "three";
      import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

      // ---- Logo face texture: blue triangle with the white Delta mark --------
      // The mark is drawn as clean geometry (a tilted elliptical ring and a
      // disc) fitted to assets/hub-mark.png, so its curves stay smooth at any
      // size. Frame: equilateral triangle, apex (W/2, 0), base y = H.
      const BLUE = "#0a84d8";
      const TEX_W = 2048,
        TEX_H = Math.round((TEX_W * Math.sqrt(3)) / 2);
      const canvas = document.createElement("canvas");
      canvas.width = TEX_W;
      canvas.height = TEX_H;
      const g = canvas.getContext("2d");
      g.fillStyle = BLUE;
      g.fillRect(0, 0, TEX_W, TEX_H);
      // hub-mark.png frame: apex (256, 1), base y = 383, x 35..476 (441 px wide)
      const k = TEX_W / 441,
        X = (x) => (x - 35) * k,
        Y = (y) => (y - 1) * k;
      g.strokeStyle = g.fillStyle = "#ffffff";
      g.lineWidth = 16.5 * k;
      g.beginPath();
      g.ellipse(X(237.2), Y(258.8), 113.9 * k, 67.1 * k, -0.75, 0, Math.PI * 2);
      g.stroke();
      g.beginPath();
      g.arc(X(296.05), Y(284.85), 51.4 * k, 0, Math.PI * 2);
      g.fill();
      const faceTexture = new THREE.CanvasTexture(canvas);
      faceTexture.colorSpace = THREE.SRGBColorSpace;
      faceTexture.anisotropy = 8;

      // ---- Rounded regular tetrahedron ---------------------------------------
      // Edge length 1, apex up, centroid at the origin. Rounding keeps the four
      // face planes where they are (a true fillet of radius r): the faces are
      // the inner tetrahedron's faces pushed out by r, the edges are cylinders
      // and the corners spherical triangles, all with exact normals.
      const L = 1;
      const H = Math.sqrt(2 / 3) * L; // height
      const R0 = L / Math.sqrt(3); // circumradius of base triangle
      const outer = [new THREE.Vector3(0, (3 * H) / 4, 0)];
      for (let i = 0; i < 3; i++) {
        const t = ((i * 2 - 1) * Math.PI) / 3;
        outer.push(new THREE.Vector3(R0 * Math.sin(t), -H / 4, R0 * Math.cos(t)));
      }
      const FACES = [
        [0, 1, 2],
        [0, 2, 3],
        [0, 3, 1],
        [1, 3, 2],
      ]; // first index is the face's "up" corner for the logo
      const INRADIUS = L / (2 * Math.sqrt(6));

      function faceNormal(a, b, c) {
        const n = new THREE.Vector3()
          .subVectors(b, a)
          .cross(new THREE.Vector3().subVectors(c, a))
          .normalize();
        // make outward
        if (n.dot(a) < 0) n.negate();
        return n;
      }

      function buildGeometry(r) {
        r = Math.min(r, INRADIUS * 0.98);
        const s = (INRADIUS - r) / INRADIUS;
        const inner = outer.map((v) => v.clone().multiplyScalar(s));
        const normals = FACES.map(([a, b, c]) => faceNormal(outer[a], outer[b], outer[c]));

        const flat = { pos: [], nor: [], uv: [] };
        const round = { pos: [], nor: [] };
        const LOGO = [
          [TEX_W / 2, 0],
          [0, TEX_H],
          [TEX_W, TEX_H],
        ];

        // Flat faces, UV mapped from the *outer* face so the mark keeps its size.
        FACES.forEach(([a, b, c], f) => {
          const n = normals[f];
          const tri = [a, b, c].map((i) => inner[i].clone().addScaledVector(n, r));
          const [A, B, C] = [a, b, c].map((i) => outer[i]);
          const v0 = new THREE.Vector3().subVectors(B, A),
            v1 = new THREE.Vector3().subVectors(C, A);
          const d00 = v0.dot(v0),
            d01 = v0.dot(v1),
            d11 = v1.dot(v1),
            den = d00 * d11 - d01 * d01;
          for (const p of tri) {
            const v2 = new THREE.Vector3().subVectors(p, A);
            const d20 = v2.dot(v0),
              d21 = v2.dot(v1);
            const wb = (d11 * d20 - d01 * d21) / den,
              wc = (d00 * d21 - d01 * d20) / den,
              wa = 1 - wb - wc;
            const x = wa * LOGO[0][0] + wb * LOGO[1][0] + wc * LOGO[2][0];
            const y = wa * LOGO[0][1] + wb * LOGO[1][1] + wc * LOGO[2][1];
            flat.pos.push(p.x, p.y, p.z);
            flat.nor.push(n.x, n.y, n.z);
            flat.uv.push(x / TEX_W, 1 - y / TEX_H);
          }
        });

        if (r > 0) {
          const push = (center, nrm) => {
            round.pos.push(center.x + nrm.x * r, center.y + nrm.y * r, center.z + nrm.z * r);
            round.nor.push(nrm.x, nrm.y, nrm.z);
          };
          const slerp = (n1, n2, t) => {
            const ang = n1.angleTo(n2);
            const so = Math.sin(ang);
            return n1
              .clone()
              .multiplyScalar(Math.sin((1 - t) * ang) / so)
              .addScaledVector(n2, Math.sin(t * ang) / so);
          };
          // Edges: each pair of faces shares one edge.
          const SEG = 16;
          for (let f1 = 0; f1 < 4; f1++)
            for (let f2 = f1 + 1; f2 < 4; f2++) {
              const shared = FACES[f1].filter((i) => FACES[f2].includes(i));
              const [p, q] = shared.map((i) => inner[i]);
              const n1 = normals[f1],
                n2 = normals[f2];
              for (let k = 0; k < SEG; k++) {
                const a = slerp(n1, n2, k / SEG),
                  b = slerp(n1, n2, (k + 1) / SEG);
                push(p, a), push(q, a), push(q, b);
                push(p, a), push(q, b), push(p, b);
              }
            }
          // Corners: spherical triangle spanned by the three face normals.
          const DIV = 12;
          for (let v = 0; v < 4; v++) {
            const ns = FACES.map((f, i) => (f.includes(v) ? normals[i] : null)).filter(Boolean);
            const P = (i, j) => {
              // barycentric grid point, normalized onto the sphere
              const k = DIV - i - j;
              return new THREE.Vector3()
                .addScaledVector(ns[0], k)
                .addScaledVector(ns[1], i)
                .addScaledVector(ns[2], j)
                .normalize();
            };
            for (let i = 0; i < DIV; i++)
              for (let j = 0; j < DIV - i; j++) {
                push(inner[v], P(i, j)), push(inner[v], P(i + 1, j)), push(inner[v], P(i, j + 1));
                if (j < DIV - i - 1) {
                  push(inner[v], P(i + 1, j)), push(inner[v], P(i + 1, j + 1)), push(inner[v], P(i, j + 1));
                }
              }
          }
        }

        const make = (o, uv) => {
          const geo = new THREE.BufferGeometry();
          geo.setAttribute("position", new THREE.Float32BufferAttribute(o.pos, 3));
          geo.setAttribute("normal", new THREE.Float32BufferAttribute(o.nor, 3));
          if (uv) geo.setAttribute("uv", new THREE.Float32BufferAttribute(o.uv, 2));
          return geo;
        };
        return { flat: make(flat, true), round: make(round, false) };
      }

      // ---- Materials --------------------------------------------------------
      // Low specular + a light ground bounce so the rounded edges shade between
      // their two faces instead of picking up dark reflections at grazing angles.
      const common = { roughness: 0.42, metalness: 0, specularIntensity: 0.45, envMapIntensity: 0.22, side: THREE.DoubleSide };
      const faceMat = new THREE.MeshPhysicalMaterial({ ...common, map: faceTexture });
      const edgeMat = new THREE.MeshPhysicalMaterial({ ...common, color: new THREE.Color(BLUE) });

      // ---- Views (big preview + actual axle size) ----------------------------
      const state = {
        r: 0.01,
        period: 120, // same as the wheel (one revolution every two minutes)
        playing: !matchMedia("(prefers-reduced-motion: reduce)").matches,
        yaw: 0.38,
        pitch: 0,
      };
      const views = [];

      function makeView(el) {
        const renderer = new THREE.WebGLRenderer({ canvas: el, antialias: true, alpha: true });
        renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
        renderer.toneMapping = THREE.NoToneMapping;
        const scene = new THREE.Scene();
        const pmrem = new THREE.PMREMGenerator(renderer);
        scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
        const key = new THREE.DirectionalLight(0xffffff, 1.3);
        key.position.set(-2, 3, 4);
        scene.add(key);
        scene.add(new THREE.HemisphereLight(0xffffff, 0xbfdcea, 0.9));
        const fill = new THREE.DirectionalLight(0xcfefff, 0.5);
        fill.position.set(3, -1, 2);
        scene.add(fill);
        const camera = new THREE.PerspectiveCamera(24, 1, 0.1, 20);
        camera.position.set(0, 0, 3.05);
        const tilt = new THREE.Group(); // pitch (camera tilt)
        const spin = new THREE.Group(); // yaw around the apex axis
        tilt.add(spin);
        scene.add(tilt);
        // centre the shape in the disc (centroid sits 0 below the apex axis)
        tilt.position.y = -0.05;
        const v = { renderer, scene, camera, tilt, spin, el, meshes: [] };
        views.push(v);
        return v;
      }

      function rebuild() {
        const geo = buildGeometry(state.r);
        for (const v of views) {
          v.meshes.forEach((m) => v.spin.remove(m));
          v.meshes = [new THREE.Mesh(geo.flat, faceMat), new THREE.Mesh(geo.round, edgeMat)];
          v.meshes.forEach((m) => v.spin.add(m));
        }
      }

      function resize() {
        for (const v of views) {
          const w = v.el.clientWidth,
            h = v.el.clientHeight;
          v.renderer.setSize(w, h, false);
          v.camera.aspect = w / h;
          v.camera.updateProjectionMatrix();
        }
      }

      function render() {
        for (const v of views) {
          v.spin.rotation.y = state.yaw;
          v.tilt.rotation.x = state.pitch;
          v.renderer.render(v.scene, v.camera);
        }
      }

      makeView(document.getElementById("big"));
      makeView(document.getElementById("small"));
      rebuild();
      resize();
      addEventListener("resize", resize);

      let last = null;
      function frame(now) {
        if (state.playing && !drag && last !== null)
          state.yaw += (Math.min(now - last, 80) / 1000) * ((2 * Math.PI) / state.period);
        last = now;
        render();
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);

      // ---- Interaction --------------------------------------------------------
      let drag = null;
      for (const v of views) {
        v.el.addEventListener("pointerdown", (e) => {
          v.el.setPointerCapture(e.pointerId);
          drag = [e.clientX, e.clientY, v.el];
        });
        v.el.addEventListener("pointermove", (e) => {
          if (!drag || drag[2] !== v.el) return;
          state.yaw += ((e.clientX - drag[0]) * 2 * Math.PI) / v.el.clientWidth;
          state.pitch = Math.max(-1.2, Math.min(1.2, state.pitch + ((e.clientY - drag[1]) * Math.PI) / v.el.clientHeight));
          drag = [e.clientX, e.clientY, v.el];
        });
        v.el.addEventListener("lostpointercapture", () => (drag = null));
      }
      const $ = (id) => document.getElementById(id);
      $("radius").addEventListener("input", (e) => {
        state.r = +e.target.value;
        $("radius-out").textContent = state.r.toFixed(3);
        rebuild();
      });
      $("period").addEventListener("input", (e) => {
        state.period = +e.target.value;
        $("period-out").textContent = state.period + " s";
      });
      const sync = () => ($("toggle").textContent = state.playing ? "暫停" : "播放");
      $("toggle").onclick = () => {
        state.playing = !state.playing;
        sync();
      };
      $("front").onclick = () => {
        state.playing = false;
        state.yaw = 0;
        state.pitch = 0;
        sync();
      };
      sync();
      window.__demo = state;
    </script>
  </body>
</html>
